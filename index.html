<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date | Regina & Marcus</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wedding: {
                            blue: '#4A6B82',
                            lightBlue: '#8FA8BE',
                            paleBlue: '#E8F0F5',
                            cream: '#FAF8F5',
                            gold: '#D4AF37',
                            dark: '#2C3E50'
                        }
                    },
                    fontFamily: {
                        serif: ['Cormorant Garamond', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                        script: ['Great Vibes', 'cursive']
                    }
                }
            }
        }
    </script>
    <style>
        .polaroid-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .bg-pattern {
            background-color: #FAF8F5;
            background-image: radial-gradient(#8FA8BE 0.5px, transparent 0.5px), radial-gradient(#8FA8BE 0.5px, #FAF8F5 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            background-opacity: 0.15;
        }
    </style>
</head>
<body class="bg-wedding-cream text-wedding-dark font-sans min-h-screen flex flex-col justify-between relative overflow-x-hidden bg-pattern">

    <!-- Elementos Botânicos Decorativos de Fundo -->
    <div class="fixed -top-12 -left-12 w-48 h-48 md:w-80 md:h-80 pointer-events-none opacity-20 text-wedding-blue z-0">
        <svg viewBox="0 0 100 100" fill="currentColor">
            <path d="M30,90 Q50,50 90,30 Q60,60 30,90 Z"></path>
            <path d="M25,70 Q45,35 75,20 Q50,45 25,70 Z"></path>
            <path d="M15,50 Q35,20 60,10 Q40,30 15,50 Z"></path>
        </svg>
    </div>
    <div class="fixed -bottom-12 -right-12 w-48 h-48 md:w-80 md:h-80 pointer-events-none opacity-20 text-wedding-blue z-0 transform rotate-180">
        <svg viewBox="0 0 100 100" fill="currentColor">
            <path d="M30,90 Q50,50 90,30 Q60,60 30,90 Z"></path>
            <path d="M25,70 Q45,35 75,20 Q50,45 25,70 Z"></path>
            <path d="M15,50 Q35,20 60,10 Q40,30 15,50 Z"></path>
        </svg>
    </div>

    <!-- Conteúdo Principal -->
    <main class="container mx-auto px-4 py-8 md:py-12 flex-grow flex flex-col items-center justify-center z-10 max-w-4xl">
        
        <!-- Cabeçalho / Título -->
        <header class="text-center mb-6 md:mb-8">
            <p class="text-wedding-blue font-medium tracking-[0.3em] uppercase text-xs md:text-sm mb-2">Reserve a Data</p>
            <h1 class="font-serif text-4xl md:text-6xl text-wedding-dark tracking-wide font-normal">
                Regina <span class="font-script text-wedding-blue text-3xl md:text-5xl lowercase px-1">&</span> Marcus
            </h1>
            <div class="w-16 h-0.5 bg-wedding-lightBlue mx-auto mt-4 mb-2"></div>
        </header>

        <!-- Noivinhos Vetoriais Ilustrados -->
        <div class="mb-8 flex justify-center items-center">
            <div class="bg-white p-3 rounded-full shadow-md border border-wedding-paleBlue">
                <svg class="w-16 h-16 text-wedding-blue" viewBox="0 0 100 100" fill="currentColor">
                    <!-- Noivo -->
                    <circle cx="38" cy="30" r="10" fill="#2C3E50"/>
                    <path d="M26 44 C26 42 38 40 50 44 L48 75 L38 75 L38 90 L34 90 L34 75 L28 75 Z" fill="#2C3E50"/>
                    <!-- Gravata Borboleta -->
                    <polygon points="36,44 40,44 38,46" fill="#D4AF37"/>
                    
                    <!-- Noiva -->
                    <circle cx="62" cy="32" r="9" fill="#4A6B82"/>
                    <!-- Coque/Cabelo -->
                    <circle cx="67" cy="28" r="4" fill="#4A6B82"/>
                    <!-- Vestido -->
                    <path d="M53 45 C58 43 66 43 71 45 L78 90 L46 90 Z" fill="#FAF8F5" stroke="#4A6B82" stroke-width="1.5"/>
                    <path d="M57 45 L62 55 L67 45" fill="none" stroke="#4A6B82" stroke-width="1.5"/>
                    
                    <!-- Coração Central -->
                    <path d="M50 22 C50 18 44 16 44 20 C44 23 50 26 50 26 C50 26 56 23 56 20 C56 16 50 18 50 22 Z" fill="#E53E3E"/>
                </svg>
            </div>
        </div>

        <!-- Mural de Fotos Polaroid -->
        <section class="w-full mb-10">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 px-4">
                
                <!-- Foto 1 (Praia Beijo) -->
                <div class="transform -rotate-2 hover:rotate-0 transition-transform duration-300">
                    <div class="bg-white p-3 pb-8 rounded shadow-lg polaroid-shadow border border-gray-100">
                        <div class="aspect-[4/5] bg-wedding-paleBlue rounded-sm overflow-hidden relative flex items-center justify-center">
                            <img src="foto1.jpg" alt="Regina e Marcus na praia" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'p-4 text-center text-xs text-wedding-blue flex flex-col items-center justify-center h-full\'><i class=\'fas fa-camera text-2xl mb-2 opacity-50\'></i><span>Foto 1<br>(foto1.jpg)</span></div>';">
                        </div>
                        <p class="font-script text-center text-xl text-wedding-blue mt-3">Nosso Amor</p>
                    </div>
                </div>

                <!-- Foto 2 (Brinde Cantinho do Café) -->
                <div class="transform rotate-3 hover:rotate-0 transition-transform duration-300">
                    <div class="bg-white p-3 pb-8 rounded shadow-lg polaroid-shadow border border-gray-100">
                        <div class="aspect-[4/5] bg-wedding-paleBlue rounded-sm overflow-hidden relative flex items-center justify-center">
                            <img src="foto2.jpg" alt="Regina e Marcus brindando" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'p-4 text-center text-xs text-wedding-blue flex flex-col items-center justify-center h-full\'><i class=\'fas fa-glass-cheers text-2xl mb-2 opacity-50\'></i><span>Foto 2<br>(foto2.jpg)</span></div>';">
                        </div>
                        <p class="font-script text-center text-xl text-wedding-blue mt-3">Momento Especial</p>
                    </div>
                </div>

                <!-- Foto 3 (Jantar Elegante) -->
                <div class="transform -rotate-3 hover:rotate-0 transition-transform duration-300">
                    <div class="bg-white p-3 pb-8 rounded shadow-lg polaroid-shadow border border-gray-100">
                        <div class="aspect-[4/5] bg-wedding-paleBlue rounded-sm overflow-hidden relative flex items-center justify-center">
                            <img src="foto3.jpg" alt="Regina e Marcus em jantar" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'p-4 text-center text-xs text-wedding-blue flex flex-col items-center justify-center h-full\'><i class=\'fas fa-heart text-2xl mb-2 opacity-50\'></i><span>Foto 3<br>(foto3.jpg)</span></div>';">
                        </div>
                        <p class="font-script text-center text-xl text-wedding-blue mt-3">Cúmplices</p>
                    </div>
                </div>

                <!-- Foto 4 (Ensaio Te Amo) -->
                <div class="transform rotate-2 hover:rotate-0 transition-transform duration-300">
                    <div class="bg-white p-3 pb-8 rounded shadow-lg polaroid-shadow border border-gray-100">
                        <div class="aspect-[4/5] bg-wedding-paleBlue rounded-sm overflow-hidden relative flex items-center justify-center">
                            <img src="foto4.jpg" alt="Regina e Marcus ensaio noivos" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'p-4 text-center text-xs text-wedding-blue flex flex-col items-center justify-center h-full\'><i class=\'fas fa-ring text-2xl mb-2 opacity-50\'></i><span>Foto 4<br>(foto4.jpg)</span></div>';">
                        </div>
                        <p class="font-script text-center text-xl text-wedding-blue mt-3">Para Sempre</p>
                    </div>
                </div>

            </div>
        </section>

        <!-- Informações da Data -->
        <section class="text-center mb-8">
            <p class="font-serif text-2xl md:text-3xl text-wedding-dark mb-1">12 de Dezembro de 2026</p>
            <p class="text-xs md:text-sm text-gray-500 tracking-wider uppercase">Curitiba • Paraná</p>
        </section>

        <!-- Contador Regressivo -->
        <section class="w-full max-w-md bg-white/80 backdrop-blur-sm p-4 md:p-6 rounded-xl border border-wedding-paleBlue shadow-sm mb-8">
            <div class="grid grid-cols-4 gap-2 text-center">
                <div class="p-2">
                    <span id="days" class="block font-serif text-2xl md:text-3xl font-bold text-wedding-blue">00</span>
                    <span class="text-[10px] md:text-xs text-gray-500 uppercase tracking-wider">Dias</span>
                </div>
                <div class="p-2 border-l border-wedding-paleBlue">
                    <span id="hours" class="block font-serif text-2xl md:text-3xl font-bold text-wedding-blue">00</span>
                    <span class="text-[10px] md:text-xs text-gray-500 uppercase tracking-wider">Horas</span>
                </div>
                <div class="p-2 border-l border-wedding-paleBlue">
                    <span id="minutes" class="block font-serif text-2xl md:text-3xl font-bold text-wedding-blue">00</span>
                    <span class="text-[10px] md:text-xs text-gray-500 uppercase tracking-wider">Minutos</span>
                </div>
                <div class="p-2 border-l border-wedding-paleBlue">
                    <span id="seconds" class="block font-serif text-2xl md:text-3xl font-bold text-wedding-blue">00</span>
                    <span class="text-[10px] md:text-xs text-gray-500 uppercase tracking-wider">Segundos</span>
                </div>
            </div>
        </section>

        <!-- Botões de Ação -->
        <div class="flex flex-col sm:flex-row gap-4 w-full max-w-md justify-center">
            <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Casamento+Regina+e+Marcus&dates=20261212T160000Z/20261212T230000Z&details=Save+the+date+do+casamento+de+Regina+e+Marcus!&location=Curitiba+-+PR" 
               target="_blank" 
               class="flex items-center justify-center gap-2 bg-wedding-blue hover:bg-wedding-dark text-white px-6 py-3 rounded-full text-xs font-semibold tracking-wider uppercase transition-colors shadow-md text-center">
                <i class="far fa-calendar-plus text-sm"></i>
                Adicionar à Agenda
            </a>
            
            <a href="#rsvp" 
               onclick="alert('Em breve abriremos a confirmação de presença!')"
               class="flex items-center justify-center gap-2 bg-white hover:bg-wedding-cream text-wedding-blue border border-wedding-blue px-6 py-3 rounded-full text-xs font-semibold tracking-wider uppercase transition-colors shadow-sm text-center">
                <i class="far fa-envelope text-sm"></i>
                Confirmar Presença
            </a>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="text-center py-6 text-xs text-gray-400 z-10 border-t border-wedding-paleBlue/50 mt-8">
        <p class="font-serif italic text-sm text-wedding-blue mb-1">Com carinho, Regina & Marcus</p>
        <p>&copy; 2026 • Todos os direitos reservados</p>
    </footer>

    <!-- Lógica do Contador -->
    <script>
        const weddingDate = new Date('December 12, 2026 16:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = weddingDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = String(days).padStart(2, '0');
                document.getElementById('hours').innerText = String(hours).padStart(2, '0');
                document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
                document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
            } else {
                document.getElementById('days').innerText = '00';
                document.getElementById('hours').innerText = '00';
                document.getElementById('minutes').innerText = '00';
                document.getElementById('seconds').innerText = '00';
            }
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
